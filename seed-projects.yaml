  - id: antigravity-os
    name: Antigravity OS experiment
    summary:
      en: Google's official Antigravity 2.0 demo in which a team of agents on Gemini 3.5 Flash built a functional OS that could run FreeDoom, from a single prompt.
      zh: Google 官方 Antigravity 2.0 演示：一队运行 Gemini 3.5 Flash 的 agent 从单条提示出发，做出能运行 FreeDoom 的功能型操作系统。
    description:
      en: The Antigravity blog (19 May 2026) reports 93 subagents, 15,314 model calls, more than 339M input tokens (over 2.6B including cache, output, and thinking), and an API-price cost of $916.92. The post lists missing features such as floating-point math, hardware acceleration, complex multi-threading, sandboxing, and JIT. No public source repository for the generated OS was found.
      zh: 官方博客（2026-05-19）给出 93 个 subagent、15,314 次模型调用、超过 3.39 亿输入 token（含 cache/输出/思考则超过 26 亿）以及按 API 计价 916.92 美元。文中列出无浮点、无硬件加速、无复杂多线程、无沙箱、无 JIT 等限制。未找到该 OS 的公开源码仓库。
    repo_url: null
    homepage_url: "https://antigravity.google/blog/google-antigravity-built-an-os"
    article_urls:
      - "https://antigravity.google/blog/google-antigravity-built-an-os"
    harnesses: [antigravity]
    models: [gemini-3.5-flash]
    categories: [os, kernel]
    difficulty: very-high
    evidence:
      - type: official_blog
        url: "https://antigravity.google/blog/google-antigravity-built-an-os"
        quote: "It was done using Gemini 3.5 Flash from a single prompt. ... We could play Doom on it."
        accessed: "2026-11-12"
    human_involvement: autonomous_multi_agent
    human_involvement_notes:
      en: The post says the successful run had no additional human guidance or corrections after the initial prompt, after earlier runs were found to have cheated by reading leftover conversation history.
      zh: 博文称成功的那一轮在初始提示之后没有额外的人类指导或纠正；更早的一轮曾因读取未清理的历史对话而被发现“作弊”。
