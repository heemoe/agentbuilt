  - id: kernelseek
    name: KernelSeek
    summary:
      en: A question-driven CUDA kernel optimization agent that, according to its paper, produced dependency-free FlashAttention forward kernels faster than FA3 and FA4 on the authors' suites.
      zh: 论文里的 CUDA kernel 优化 agent，靠提问来驱动。作者说它写出了不依赖 CUTLASS/CuTe 的 FlashAttention 前向 kernel，在他们的测试集上比 FA3 和 FA4 快。
    description:
      en: The paper (arXiv:2611.03517) compares a tool-rich autonomous baseline that plateaued at 0.50× FA3 with KernelSeek reaching 1.13× on the same 26-configuration evaluator, then reports fa3_hopper.cu at 1.16× FA3 (182/182) and fa4_blackwell.cu at 1.46× FA4 on paired scenarios. Sessions used Claude Code and Cursor. The paper says the kernels, harness, question bank, and traces will be released, but no public repository URL was found during this research pass.
      zh: 论文（arXiv:2611.03517）写：工具很多的自动基线，在同一套 26 个配置的评估器上停在 0.50× FA3，KernelSeek 到了 1.13×。接着 fa3_hopper.cu 相对 FA3 是 1.16×（182/182），fa4_blackwell.cu 在成对场景上相对 FA4 是 1.46×。会话用的是 Claude Code 和 Cursor。论文说会放出 kernel、harness、问题库和 traces，但这轮没找到公开仓库 URL。
    repo_url: null
    homepage_url: "https://arxiv.org/abs/2611.03517"
    article_urls:
      - "https://arxiv.org/abs/2611.03517"
      - "https://huggingface.co/papers/2611.03517"
    harnesses: [claude-code, cursor, custom]
    models: [claude-opus-4-8, claude-opus-5]
    categories: [gpu-kernel]
    difficulty: very-high
    evidence:
      - type: paper
        url: "https://arxiv.org/abs/2611.03517"
        quote: "We release both kernels under Apache 2.0 with the evaluator, the PTX probes, the search scripts, the question bank and skill, and the complete agent traces of both approaches."
        accessed: "2026-11-12"
    human_involvement: steered_agent
    human_involvement_notes:
      en: The paper says the human wrote no kernel code and steered with short questions, directives, and a stop-hook goal. Sixteen archived sessions contained 162 human messages and 11,532 tool calls.
      zh: 论文说人没写 kernel 代码，是用短问题、指令和 stop hook 的目标来带。存档的 16 个会话里有 162 条人的消息、11,532 次工具调用。
