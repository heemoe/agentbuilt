projects:
  - id: ginux
    name: Ginux
    summary:
      en: A Rust research kernel, later a userspace Linux-compatibility kernel, built with OpenAI Codex under human-directed architecture and acceptance gates.
      zh: OpenAI Codex 写的 Rust 研究内核，架构和验收条件由人来定。能引导的那一阶段已经冻结，主线改成了用户态的 Linux 兼容内核。
    description:
      en: Gregory Kurtzer reports that one persistent Codex task using GPT-5.6 Sol produced Ginux over about eleven days. The standalone kernel booted via UEFI and ran selected unmodified Alpine programs and a Rocky Linux 10 systemd boot. Active development now continues as a userspace kernel; the bootable research snapshot lives on the bootable-kernel branch.
      zh: Gregory Kurtzer 写过：一个一直开着的 Codex 任务，模型是 GPT-5.6 Sol，大约十一天做出 Ginux。独立内核用 UEFI 引导，跑过一部分没改过的 Alpine 程序，也跑过 Rocky Linux 10 的 systemd 启动。现在还在做的是用户态内核，能引导的研究快照留在 bootable-kernel 分支。
    repo_url: "https://github.com/gmkurtzer/ginux"
    homepage_url: null
    article_urls:
      - "https://github.com/gmkurtzer/ginux/blob/bootable-kernel/docs/paper/ginux-ai-systems-report.tex"
      - "https://itsfoss.com/news/ginux/"
    harnesses: [codex]
    models: [gpt-5.6-sol]
    categories: [kernel, os]
    difficulty: very-high
    evidence:
      - type: author_readme
        url: "https://github.com/gmkurtzer/ginux"
        quote: "The standalone-kernel experiment proved that an AI coding agent, directed by an experienced human through architecture, gates, and executable tests, could construct a new kernel capable of running meaningful Linux userspace."
        accessed: "2026-11-12"
      - type: paper
        url: "https://github.com/gmkurtzer/ginux/blob/bootable-kernel/docs/paper/ginux-ai-systems-report.tex"
        quote: "Over eleven days, one persistent OpenAI Codex task using GPT-5.6 Sol produced Ginux, a Rust-first x86-64 research kernel."
        accessed: "2026-11-12"
    human_involvement: steered_agent
    human_involvement_notes:
      en: The author calls this Human-Directed Agentic Engineering (HDAE). The human set architecture, constraints, and acceptance criteria; Codex implemented, booted, diagnosed, and revised. The human remains responsible for claims. Codex is not listed as an author.
      zh: 作者把这套做法叫做 Human-Directed Agentic Engineering（HDAE）。人定架构、约束和验收，Codex 负责实现、引导、排查和修改。说法和发布仍由人负责，Codex 没有列为作者。
    verified: verified
