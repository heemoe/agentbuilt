  - id: megakernel-zoo
    name: megakernel-zoo
    summary:
      en: Model-specific megakernel LLM inference engines, each written by Claude in an autonomous optimization run against a fixed evaluator and audited afterwards, reported faster than vLLM and SGLang on single-sequence decode.
      zh: 每个模型一套专用的 megakernel LLM 推理引擎。每个引擎都是 Claude 在固定评测器下自主优化写出来的，之后再审计。作者报告单序列解码比 vLLM 和 SGLang 快。
    description:
      en: Each engine runs the whole decode step of one checkpoint on one GPU architecture as a single persistent CUDA kernel or device-scheduled kernel loop. The README reports 1.13-1.77x the fastest general engine on nine models from 8B to 594B parameters with the checkpoint's own formats, and up to 2.05x with lossless model-specific weight storage. Engines are timed only after their logits match an FP64 reference, and an independent agent audited each final engine. The repository includes the evaluator, an OpenAI-compatible server, the run records in runs/, and the kit to run the same optimization with claude -p.
      zh: 每个引擎针对一个 checkpoint 和一种 GPU 架构，把整个解码步骤放进一个常驻 CUDA kernel 或设备端调度的 kernel 循环。README 说，用 checkpoint 自带的数值格式，在 8B 到 594B 的九个模型上是最快通用引擎的 1.13 到 1.77 倍；用针对模型的无损权重存储，最高 2.05 倍。引擎要先在 logits 上和 FP64 参考对齐才计时，每个最终引擎还由一个独立 agent 审计。仓库里有评测器、兼容 OpenAI 的服务器、runs/ 下的运行记录，以及用 claude -p 跑同样优化的工具。
