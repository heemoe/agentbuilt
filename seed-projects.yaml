  - id: forgekernel
    name: ForgeKernel
    summary:
      en: A self-evolving GPU-kernel agent from OpenBMB, with generated CuTe/CUDA kernels released in-tree and a paper reporting wins against expert libraries and other kernel agents.
      zh: OpenBMB 的自演化 GPU kernel agent。生成的 CuTe/CUDA kernel 随仓库发布；论文报告在多个算子上达到或超过专家库与其他 kernel agent。
    description:
      en: The agent profiles a reference kernel, writes an architecture-first milestone curriculum, and promotes accepted kernels to the next reference. The README says paper runs used Claude Fable 5.1 as the arch agent and Claude Opus 5 as the coding agent. A Claude Code skill can launch runs. Generated kernels live under kernels/.
      zh: 该 agent 会剖析参考 kernel，写出以架构为先的里程碑课程，并把被接受的 kernel 提升为下一轮参考。README 称论文实验用 Claude Fable 5.1 做 arch agent、Claude Opus 5 做 coding agent。可用 Claude Code skill 启动运行。生成的 kernel 位于 kernels/ 目录。
