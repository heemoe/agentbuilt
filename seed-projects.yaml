      en: Anthropic's research post describes 16 agents, nearly 2,000 Claude Code sessions, and about $20,000 in API cost. The repository states that aside from one human-written paragraph, 100% of the code and documentation was written by Claude Opus 4.6. A human wrote test cases but did not pair-program or give code-quality feedback.
      zh: Anthropic 研究博文描述了 16 个 agent、近 2000 次 Claude Code 会话，以及约 2 万美元 API 成本。仓库声明除一段人类写的说明外，代码与文档 100% 由 Claude Opus 4.6 编写。人类编写了测试用例，但没有结对调试，也没有提供代码质量反馈。
    repo_url: "https://github.com/anthropics/claudes-c-compiler"
