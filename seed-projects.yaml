  - id: aws-emulator
    name: AWS Emulator
    summary:
      en: A local emulator of the AWS APIs in Rust that AWS says is written and maintained entirely by autonomous AI agents, with the source published on GitHub under CC0.
      zh: 用 Rust 写的本地 AWS API 模拟器。AWS 说代码全部由自主 AI agent 编写和维护，源码以 CC0 发布在 GitHub。
    description:
      en: AWS announced AWS Emulator as generally available on 11 November 2026. It serves the AWS APIs that have a public API model over a local HTTPS endpoint. Amazon's write-up says three teams of agents build it (one maintains fidelity tests checked against real AWS, one finds divergences and files issues, one fixes issues behind an agent review gate), that thousands of issues are fixed per day, and that the team has not written or reviewed any of the code. The first weekend prototype was made with Kiro; the production pipeline runs on Amazon Bedrock AgentCore Runtime, AWS CodePipeline, and AWS CodeCommit. The fidelity tests are public in aws/aws-emulator-evaluation-suite.
      zh: AWS 在 2026-11-11 宣布 AWS Emulator 正式可用。凡是有公开 API 模型的 AWS 服务，它都在本机 HTTPS 端点上模拟。Amazon 的文章说由三组 agent 来做：一组维护对照真实 AWS 校验过的 fidelity 测试，一组找出不一致并开 issue，一组修 issue，修完要过 agent 审查关卡；每天修掉几千个 issue，团队自己没写也没审过任何代码。最早的周末原型是用 Kiro 做的，正式流水线跑在 Amazon Bedrock AgentCore Runtime、AWS CodePipeline 和 AWS CodeCommit 上。fidelity 测试公开在 aws/aws-emulator-evaluation-suite。
