  - id: maxkernel
    name: MaxKernel
    summary:
      en: A multi-agent system that generates and tunes high-performance TPU kernels, evaluated with Gemini 3.1 Pro and released under Google's accelerator-agents repository.
      zh: 一套多 agent 系统，用来生成和调优高性能 TPU kernel。实验用的是 Gemini 3.1 Pro，代码放在 Google 的 accelerator-agents 仓库。
    description:
      en: The paper describes HITL, fully autonomous, and graph-based search paradigms sharing planning, implementation, debugging, testing, and profiling sub-agents. Experiments on JaxBench and real model workloads were run with Gemini 3.1 Pro. Code is published in the maxkernel directory of AI-Hypercomputer/accelerator-agents.
      zh: 论文写了三种做法：有人参与、完全自动、按图搜索。规划、实现、调试、测试、剖析这几类子 agent 是共用的。JaxBench 和真实模型负载上的实验用 Gemini 3.1 Pro。代码在 AI-Hypercomputer/accelerator-agents 的 maxkernel 目录。
    repo_url: "https://github.com/AI-Hypercomputer/accelerator-agents"
    homepage_url: "https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/maxkernel"
