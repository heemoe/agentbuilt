      en: NeverSharp asks whether a C# port of tsc can match typescript-go. The report says a straight port parses about 6x slower than Go, while the optimized NativeAOT build beats typescript-go 7.0.2 on parsing, type checking, and emit after tuning on the benchmark corpus, and is still about twice as slow as the Rust port tsrs. The project was closed on 2026-11-07 as a research artifact with no end-user CLI.
