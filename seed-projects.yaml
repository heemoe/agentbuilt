    homepage_url: "https://docs.aws.amazon.com/emulator/latest/userguide/what-is-service.html"
    article_urls:
      - "https://www.aboutamazon.com/news/aws/how-autonomous-ai-agents-built-aws-emulator"
      - "https://aws.amazon.com/blogs/aws/test-your-applications-against-aws-locally-with-aws-emulator/"
      - "https://github.com/aws/aws-emulator-evaluation-suite"
