        quote: "The emulator was written entirely by autonomous agents. Our team hasn’t written or reviewed any of the code."
        accessed: "2026-11-23"
      - type: official_blog
        url: "https://aws.amazon.com/blogs/aws/test-your-applications-against-aws-locally-with-aws-emulator/"
        quote: "AWS Emulator is built and maintained by agents from the AWS API models using Amazon Bedrock AgentCore Runtime Instances, AWS CodePipeline, and AWS CodeCommit, so it stays current with AWS as those models change."
        accessed: "2026-11-23"
