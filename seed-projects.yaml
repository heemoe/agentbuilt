      zh: HP 对这台打印机的支持停在 Windows XP 时代。这个驱动通过 “添加打印机” 向导（从磁盘安装）装上，打印机固件取自 HP 原始镜像。作者说文字、位图和多页文档都能打印。仓库里有更新日志、测试记录和发布计划。
