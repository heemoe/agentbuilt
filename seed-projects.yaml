  - id: claudes-c-compiler
    name: Claude's C Compiler (CCC)
    summary:
      en: A from-scratch, dependency-free C compiler in Rust, written by parallel Claude Code agents running Claude Opus 4.6, capable of building Linux 6.9 and other large C projects.
      zh: 用 Rust 从零写的 C 编译器，没有外部依赖。并行的 Claude Code（Claude Opus 4.6）写的，能编 Linux 6.9 这类大型 C 项目。
    description:
      en: Anthropic's research post describes 16 agents, nearly 2,000 Claude Code sessions, and about $20,000 in API cost. The repository states that aside from one human-written paragraph, 100% of the code and documentation was written by Claude Opus 4.6. A human wrote test cases but did not pair-program or give code-quality feedback.
      zh: Anthropic 的研究博文写了 16 个 agent、将近 2000 次 Claude Code 会话，API 大约花了 2 万美元。仓库说，除了人写的一段说明，代码和文档 100% 是 Claude Opus 4.6 写的。人写了测试用例，没有结对调试，也没有就代码质量给反馈。
    repo_url: "https://github.com/anthropics/claudes-c-compiler"
    homepage_url: "https://www.anthropic.com/research/building-c-compiler"
    article_urls:
      - "https://www.anthropic.com/research/building-c-compiler"
    harnesses: [claude-code]
    models: [claude-opus-4.6]
    categories: [compiler]
    difficulty: very-high
    evidence:
      - type: official_blog
        url: "https://www.anthropic.com/research/building-c-compiler"
        quote: "Over nearly 2,000 Claude Code sessions and $20,000 in API costs, the agent team produced a 100,000-line compiler that can build Linux 6.9 on x86, ARM, and RISC-V."
        accessed: "2026-11-12"
      - type: official_repo
        url: "https://github.com/anthropics/claudes-c-compiler"
        quote: "With the exception of this one paragraph that was written by a human, 100% of the code and documentation in this repository was written by Claude Opus 4.6."
        accessed: "2026-11-12"
    human_involvement: autonomous_multi_agent
    human_involvement_notes:
      en: A human wrote tests the agents were told to pass and designed the parallel harness, but did not interactively pair-program or review code quality during development.
      zh: 人写了要 agent 通过的测试，也设计了并行 harness。开发过程中没有坐在一起结对写，也没有评代码质量。
